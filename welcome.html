<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡迎使用翻翻吧 🌿</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      max-width: 600px;
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 48px 44px;
      backdrop-filter: blur(12px);
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .emoji-logo {
      font-size: 52px;
      display: block;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #A3D179, #F9D423);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #64748b;
    }

    /* ── 步驟 ── */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 36px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 16px 18px;
      transition: border-color 0.2s;
    }

    .step:hover {
      border-color: rgba(163, 209, 121, 0.25);
    }

    .step-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #A3D179, #F9D423);
      color: #0f1117;
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-content h3 {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .step-content p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.6;
    }

    .step-content code {
      background: rgba(163, 209, 121, 0.12);
      color: #A3D179;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    /* ── 按鈕區 ── */
    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #A3D179, #8fc45e);
      color: #0f1117;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-primary:hover  { opacity: 0.9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      border-color: rgba(255,255,255,0.25);
      color: #e2e8f0;
    }

    /* ── 頁尾 ── */
    .footer-links {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #475569;
    }

    .footer-links a {
      color: #64748b;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer-links a:hover { color: #A3D179; }
  </style>
</head>
<body>
  <div class="card">

    <!-- Hero -->
    <div class="hero">
      <span class="emoji-logo">🌿</span>
      <h1>翻翻吧已安裝完成！</h1>
      <p class="subtitle">選取任意網頁文字，AI 立刻幫你翻譯、解釋、優化</p>
    </div>

    <!-- 3 步驟 -->
    <div class="steps">

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-content">
          <h3>設定 API Key</h3>
          <p>點擊下方「前往設定」，輸入 Gemini、Groq 或 OpenRouter 的 API Key。至少設定一個即可開始使用。免費方案就夠用 🎉</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-content">
          <h3>選取網頁文字</h3>
          <p>在任意網頁<strong>滑鼠選取文字</strong>，右側會出現懸浮工具列。點擊 <code>翻譯</code> <code>解釋</code> <code>優化</code> 即可觸發。</p>
        </div>
      </div>

      <div class="step">
        <div class="step-num">3</div>
        <div class="step-content">
          <h3>查看結果 &amp; 存入筆記</h3>
          <p>AI 結果即時串流顯示。可拖曳移動、釘住保留、或按寶石 💎 按鈕直接存入 Obsidian 週記。</p>
        </div>
      </div>

    </div>

    <!-- 按鈕 -->
    <div class="btn-group">
      <button class="btn-primary" id="btnSettings">⚙️ 前往設定 API Key</button>
      <button class="btn-secondary" id="btnClose">稍後再說</button>
    </div>

    <div class="footer-links">
      <a href="privacy-policy.html" target="_blank">隱私權政策</a>
      <a href="https://github.com/unomae/fan-fan-ba" target="_blank">GitHub</a>
    </div>

  </div>

  <script>
    // 前往設定頁
    document.getElementById('btnSettings').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });

    // 關閉此頁
    document.getElementById('btnClose').addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
