<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翻翻吧 Release QA 測試看板</title>
  <style>
    :root {
      --color-paper-white: #f6f6f8;
      --color-card-white: #ffffff;
      --color-deep-ink: #011821;
      --color-carbon: #12161e;
      --color-slate: #7c7f88;
      --color-mist: #e3e4e8;
      --color-fog: #a9acb6;
      --color-graphite: #3b3e47;
      --color-deep-indigo: #111a4a;
      --color-ember-orange: #ec652b;
      --color-midnight-teal: #023247;
      --color-forest-teal: #167e6c;
      --color-pale-cyan: #c1e8ef;
      --shadow-card: rgba(17, 26, 74, 0.1) 0 1px 3px 0,
        rgba(17, 26, 74, 0.05) 0 1px 0 0,
        inset rgba(255, 255, 255, 0.5) 0 1px 0 0;
      --shadow-hairline: rgba(87, 90, 100, 0.12) 0 0 0 1px;
      --radius: 8px;
      --font-sans: Inter, "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--color-deep-ink);
      background:
        radial-gradient(circle at 82% 18%, rgba(193, 232, 239, 0.38), transparent 24rem),
        var(--color-paper-white);
      font-family: var(--font-sans);
      line-height: 1.5;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .map-dots {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.62;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(236, 101, 43, 0.55) 0 1.4px, transparent 1.6px),
        radial-gradient(circle, rgba(126, 167, 233, 0.45) 0 1.2px, transparent 1.5px),
        radial-gradient(circle, rgba(68, 180, 139, 0.3) 0 1px, transparent 1.4px);
      background-position: 12% 18%, 74% 24%, 42% 72%;
      background-size: 34px 34px, 28px 28px, 42px 42px;
      mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    }

    .shell {
      width: min(1200px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--color-deep-indigo);
      box-shadow: var(--shadow-card);
      position: relative;
      flex: 0 0 auto;
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 999px;
      border: 2px solid var(--color-pale-cyan);
    }

    .brand-title {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--color-slate);
      font-size: 12px;
      font-family: var(--font-mono);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 32px;
      align-items: stretch;
      margin-bottom: 28px;
    }

    .hero-main {
      padding: 40px 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 6px 12px;
      border-radius: 9999px;
      background: var(--color-pale-cyan);
      color: var(--color-forest-teal);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    h1 {
      margin: 18px 0 16px;
      max-width: 780px;
      font-size: clamp(36px, 6vw, 60px);
      line-height: 1.1;
      font-weight: 300;
      letter-spacing: 0;
    }

    .lead {
      max-width: 720px;
      margin: 0;
      color: var(--color-slate);
      font-size: 18px;
    }

    .summary-card {
      background: var(--color-card-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 24px;
      align-self: center;
      min-width: 0;
    }

    .summary-card h2 {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 600;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 16px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      min-width: 0;
    }

    .metric-value {
      display: block;
      color: var(--color-deep-ink);
      font-size: 28px;
      font-weight: 300;
      line-height: 1.1;
    }

    .metric-label {
      display: block;
      margin-top: 4px;
      color: var(--color-slate);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .search,
    .select {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      background: var(--color-card-white);
      color: var(--color-carbon);
      padding: 10px 12px;
      box-shadow: var(--shadow-hairline);
    }

    .segmented {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      background: var(--color-card-white);
      box-shadow: var(--shadow-hairline);
    }

    .segment,
    .ghost-button,
    .primary-button,
    .small-button {
      min-height: 38px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
    }

    .segment {
      background: transparent;
      color: var(--color-slate);
    }

    .segment[aria-pressed="true"] {
      background: var(--color-deep-indigo);
      color: #fff;
      box-shadow: var(--shadow-card);
    }

    .ghost-button {
      background: var(--color-card-white);
      border-color: var(--color-mist);
      color: var(--color-deep-ink);
      box-shadow: var(--shadow-hairline);
    }

    .primary-button {
      background: var(--color-deep-indigo);
      color: #fff;
      box-shadow: var(--shadow-card);
    }

    .small-button {
      min-height: 34px;
      padding: 7px 10px;
      background: #fff;
      border-color: var(--color-mist);
      color: var(--color-carbon);
    }

    .small-button[data-action="accept"][aria-pressed="true"] {
      background: var(--color-pale-cyan);
      color: var(--color-forest-teal);
      border-color: transparent;
    }

    .small-button[data-action="defer"][aria-pressed="true"] {
      background: rgba(236, 101, 43, 0.12);
      color: var(--color-ember-orange);
      border-color: transparent;
    }

    .small-button[data-action="reject"][aria-pressed="true"] {
      background: var(--color-graphite);
      color: #fff;
      border-color: transparent;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .column {
      min-width: 0;
    }

    .column-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      color: var(--color-carbon);
      box-shadow: var(--shadow-hairline);
      text-align: left;
    }

    .column-toggle:hover {
      border-color: var(--color-fog);
      background: #fff;
    }

    .column-heading {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .collapse-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      background: var(--color-pale-cyan);
      color: var(--color-forest-teal);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1;
    }

    .column.is-collapsed .collapse-icon {
      background: rgba(17, 26, 74, 0.1);
      color: var(--color-deep-indigo);
    }

    .column-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--color-carbon);
    }

    .count {
      flex: 0 0 auto;
      color: var(--color-slate);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .column-body {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(300px, 1fr);
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x proximity;
      overscroll-behavior-x: contain;
    }

    .column.is-collapsed .column-body {
      display: none;
    }

    .decision-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
      padding: 20px;
      border-radius: var(--radius);
      background: var(--color-card-white);
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(227, 228, 232, 0.72);
      scroll-snap-align: start;
    }

    .decision-card.featured {
      border-top: 4px solid var(--color-ember-orange);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .decision-id {
      color: var(--color-slate);
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .severity {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 26px;
      border-radius: 9999px;
      font-family: var(--font-mono);
      font-size: 11px;
      background: var(--color-pale-cyan);
      color: var(--color-forest-teal);
    }

    .severity.p0 {
      background: rgba(236, 101, 43, 0.14);
      color: var(--color-ember-orange);
    }

    .severity.p1 {
      background: rgba(17, 26, 74, 0.1);
      color: var(--color-deep-indigo);
    }

    .decision-card h3 {
      margin: 0;
      color: var(--color-deep-ink);
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
    }

    .description {
      margin: 0;
      color: var(--color-slate);
      font-size: 14px;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-item {
      padding: 10px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      min-width: 0;
    }

    .meta-label {
      display: block;
      color: var(--color-slate);
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
    }

    .meta-value {
      display: block;
      margin-top: 3px;
      color: var(--color-carbon);
      font-size: 13px;
    }

    .recommendation {
      padding: 12px;
      border-radius: var(--radius);
      background: #f8fafb;
      border: 1px solid var(--color-mist);
      color: var(--color-midnight-teal);
      font-size: 13px;
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .comment {
      width: 100%;
      min-height: 78px;
      resize: vertical;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      padding: 10px;
      color: var(--color-carbon);
      background: #fff;
      font-size: 13px;
    }

    .export-panel {
      margin-top: 24px;
      background: var(--color-card-white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-card);
      padding: 20px;
    }

    .export-panel h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .export-output {
      width: 100%;
      min-height: 220px;
      border: 1px solid var(--color-mist);
      border-radius: var(--radius);
      background: var(--color-graphite);
      color: var(--color-pale-cyan);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.55;
      resize: vertical;
    }

    .empty {
      padding: 20px;
      border: 1px dashed var(--color-fog);
      border-radius: var(--radius);
      color: var(--color-slate);
      background: rgba(255, 255, 255, 0.62);
      font-size: 14px;
    }

    @media (max-width: 980px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .hero-main {
        padding: 16px 0 0;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .segmented,
      .toolbar {
        justify-content: stretch;
      }

      .segment,
      .toolbar button {
        flex: 1 1 auto;
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100vw - 20px, 1200px);
        padding-bottom: 28px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      h1 {
        font-size: 34px;
      }

      .summary-grid,
      .meta,
      .action-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="map-dots" aria-hidden="true"></div>
  <main class="shell">
    <nav class="topbar" aria-label="Decision board navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-title">翻翻吧 Release QA</p>
          <p class="brand-subtitle">v1.9.8 真瀏覽器驗收清單</p>
        </div>
      </div>
      <div class="toolbar">
        <button class="ghost-button" type="button" id="resetBtn">清除決策</button>
        <button class="primary-button" type="button" id="exportMarkdownBtn">匯出 Markdown</button>
        <button class="ghost-button" type="button" id="exportJsonBtn">匯出 JSON</button>
      </div>
    </nav>

    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-main">
        <span class="pill">Release QA</span>
        <h1 id="pageTitle">翻翻吧 v1.9.8 上架前要補的 QA 測試。</h1>
        <p class="lead">這張看板整理目前最該補的真瀏覽器驗收項目。P0 先擋上架風險，P1 補核心回歸，P2 收送審素材與後台 gating。</p>
      </div>
      <aside class="summary-card" aria-label="Board summary">
        <h2>看板總覽</h2>
        <div class="summary-grid">
          <div class="metric">
            <span class="metric-value" id="metricTotal">0</span>
            <span class="metric-label">總項目</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricAccepted">0</span>
            <span class="metric-label">已同意</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricDeferred">0</span>
            <span class="metric-label">已暫緩</span>
          </div>
          <div class="metric">
            <span class="metric-value" id="metricRejected">0</span>
            <span class="metric-label">已拒絕</span>
          </div>
        </div>
      </aside>
    </section>

    <section class="controls" aria-label="Filters">
      <input class="search" id="searchInput" type="search" placeholder="搜尋 title、impact、recommendation">
      <div class="segmented" role="group" aria-label="Severity filter">
        <button class="segment" type="button" data-severity="all" aria-pressed="true">All</button>
        <button class="segment" type="button" data-severity="P0" aria-pressed="false">P0</button>
        <button class="segment" type="button" data-severity="P1" aria-pressed="false">P1</button>
        <button class="segment" type="button" data-severity="P2" aria-pressed="false">P2</button>
      </div>
      <select class="select" id="statusFilter" aria-label="Status filter">
        <option value="all">全部狀態</option>
        <option value="pending">未決</option>
        <option value="accept">同意</option>
        <option value="defer">暫緩</option>
        <option value="reject">拒絕</option>
      </select>
    </section>

    <section class="board" aria-label="Decision priority rows">
      <div class="column" data-column="P0">
        <button class="column-toggle" type="button" aria-expanded="true" aria-controls="columnP0" data-toggle-column="P0">
          <span class="column-heading">
            <span class="collapse-icon" aria-hidden="true">−</span>
            <span class="column-title">P0 必須先決定</span>
          </span>
          <span class="count" id="countP0">0 items</span>
        </button>
        <div class="column-body" id="columnP0"></div>
      </div>
      <div class="column" data-column="P1">
        <button class="column-toggle" type="button" aria-expanded="true" aria-controls="columnP1" data-toggle-column="P1">
          <span class="column-heading">
            <span class="collapse-icon" aria-hidden="true">−</span>
            <span class="column-title">P1 高影響改善</span>
          </span>
          <span class="count" id="countP1">0 items</span>
        </button>
        <div class="column-body" id="columnP1"></div>
      </div>
      <div class="column" data-column="P2">
        <button class="column-toggle" type="button" aria-expanded="true" aria-controls="columnP2" data-toggle-column="P2">
          <span class="column-heading">
            <span class="collapse-icon" aria-hidden="true">−</span>
            <span class="column-title">P2 可排入後續</span>
          </span>
          <span class="count" id="countP2">0 items</span>
        </button>
        <div class="column-body" id="columnP2"></div>
      </div>
    </section>

    <section class="export-panel" aria-labelledby="exportTitle">
      <h2 id="exportTitle">匯出預覽</h2>
      <textarea class="export-output" id="exportOutput" readonly>按「匯出 Markdown」或「匯出 JSON」產生輸出。</textarea>
    </section>
  </main>

  <!-- ▼▼▼ 只需替換這塊 JSON：填入你的決策項目 ▼▼▼
       這是純 JSON，不是 JavaScript。中文字串照常寫即可；若值裡要放雙引號用 \" 跳脫。
       不要用反引號或 ${}，以免整頁變成空白。
       severity 只認 P0 / P1 / P2，其他值不會顯示。 -->
  <script type="application/json" id="decision-data">

  {

    "impact": "這是單字資料安全的最高風險點；若 migration 失敗，使用者會以為單字本遺失。",

  },
  {
    "id": "QA-P0-003",
    "severity": "P0",
    "title": "今日複習與錯題回看互動",
    "description": "最新補上的錯題回看沿用 learning / known / nextReviewAt，不新增資料模型，必須確認真 UI 與 SRS 排程一致。",
    "impact": "直接影響單字學習體驗；若排序或狀態錯，使用者會反覆看到錯的複習清單。",
    "effort": "S",
    "risk": "測試資料若沒有同時包含到期 / 未到期 / learning / known，容易漏掉狀態切換問題。",
    "recommendation": "建立 learning、known、到期、未到期單字，切今日複習與錯題回看；點記得後應離開錯題回看，下一次複習約 7 天後；點還不熟後約 1 天後再複習。"
  },
  {
    "id": "QA-P0-004",

  </script>

  <script>
    // localStorage 自動依檔案路徑分鍵，多張看板不會互相覆蓋。
    const STORAGE_KEY = "decision-board::" + location.pathname;
    const COLLAPSE_STORAGE_KEY = STORAGE_KEY + "::collapsed";
    const SEVERITIES = ["P0", "P1", "P2"];

    // 決策資料來自上方的 JSON 區塊，這裡不需要修改。
    const decisions = JSON.parse(document.getElementById("decision-data").textContent);

    let state = loadState();
    let collapsedColumns = loadCollapsedColumns();
    let severityFilter = "all";
    let searchTerm = "";

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return decisions.reduce((acc, item) => {
          acc[item.id] = saved[item.id] || { action: "pending", comment: "" };
          return acc;
        }, {});
      } catch {
        return decisions.reduce((acc, item) => {
          acc[item.id] = { action: "pending", comment: "" };
          return acc;
        }, {});
      }
    }

    function saveState() {
      // localStorage 在 sandbox / 預覽面板 / 無痕等環境可能被封鎖並拋例外。
      // 存不了就略過持久化，但記憶體狀態與 render() 仍須照跑，否則按鈕會「沒反應」。
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        /* 持久化失敗不致命：本 session 仍可正常決策，只是重整後不保留 */
      }
      updateMetrics();
    }

    function loadCollapsedColumns() {
      try {
        const saved = JSON.parse(localStorage.getItem(COLLAPSE_STORAGE_KEY) || "{}");
        return SEVERITIES.reduce((acc, severity) => {
          acc[severity] = Boolean(saved[severity]);
          return acc;
        }, {});
      } catch {
        return SEVERITIES.reduce((acc, severity) => {
          acc[severity] = false;
          return acc;
        }, {});
      }
    }

    function saveCollapsedColumns() {
      try {
        localStorage.setItem(COLLAPSE_STORAGE_KEY, JSON.stringify(collapsedColumns));
      } catch (e) {
        /* 持久化失敗不致命，同 saveState */
      }
    }

    function applyCollapsedColumns() {
      SEVERITIES.forEach((severity) => {
        const column = document.querySelector(`[data-column="${severity}"]`);
        const toggle = document.querySelector(`[data-toggle-column="${severity}"]`);
        const icon = toggle.querySelector(".collapse-icon");
        const isCollapsed = Boolean(collapsedColumns[severity]);

        column.classList.toggle("is-collapsed", isCollapsed);
        toggle.setAttribute("aria-expanded", String(!isCollapsed));
        icon.textContent = isCollapsed ? "+" : "−";
      });
    }

    function matchesFilters(item) {
      const status = document.getElementById("statusFilter").value;
      const itemState = state[item.id] || { action: "pending", comment: "" };
      const haystack = [
        item.id,
        item.severity,
        item.title,
        item.description,
        item.impact,
        item.effort,
        item.risk,
        item.recommendation,
        itemState.comment
      ].join(" ").toLowerCase();

      return (severityFilter === "all" || item.severity === severityFilter)
        && (status === "all" || itemState.action === status)
        && haystack.includes(searchTerm);
    }

    function render() {
      SEVERITIES.forEach((severity) => {
        const column = document.getElementById(`column${severity}`);
        const items = decisions.filter((item) => item.severity === severity && matchesFilters(item));
        column.innerHTML = items.length ? items.map(renderCard).join("") : '<div class="empty">目前沒有符合條件的項目。</div>';
        document.getElementById(`count${severity}`).textContent = `${items.length} items`;
      });

      bindCards();
      applyCollapsedColumns();
      updateMetrics();
    }

    function renderCard(item) {
      const itemState = state[item.id] || { action: "pending", comment: "" };
      const severityClass = item.severity.toLowerCase();
      const featured = item.severity === "P0" ? " featured" : "";

      return `
        <article class="decision-card${featured}" data-id="${escapeHtml(item.id)}">
          <div class="card-head">
            <span class="decision-id">${escapeHtml(item.id)}</span>
            <span class="severity ${severityClass}">${escapeHtml(item.severity)}</span>
          </div>
          <h3>${escapeHtml(item.title)}</h3>
          <p class="description">${escapeHtml(item.description)}</p>
          <div class="meta">
            <div class="meta-item">
              <span class="meta-label">Impact</span>
              <span class="meta-value">${escapeHtml(item.impact)}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Effort</span>
              <span class="meta-value">${escapeHtml(item.effort)}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Risk</span>
              <span class="meta-value">${escapeHtml(item.risk)}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Status</span>
              <span class="meta-value">${statusLabel(itemState.action)}</span>
            </div>
          </div>
          <div class="recommendation">${escapeHtml(item.recommendation)}</div>
          <div class="action-row" role="group" aria-label="${escapeHtml(item.id)} decision action">
            ${renderActionButton(itemState.action, "accept", "同意")}
            ${renderActionButton(itemState.action, "defer", "暫緩")}
            ${renderActionButton(itemState.action, "reject", "拒絕")}
          </div>
          <textarea class="comment" placeholder="補充你的理由、條件或待確認事項">${escapeHtml(itemState.comment)}</textarea>
        </article>
      `;
    }

    function renderActionButton(current, action, label) {
      return `<button class="small-button" type="button" data-action="${action}" aria-pressed="${current === action}">${label}</button>`;
    }

    function bindCards() {
      document.querySelectorAll(".decision-card").forEach((card) => {
        const id = card.dataset.id;
        card.querySelectorAll("[data-action]").forEach((button) => {
          button.addEventListener("click", () => {
            const nextAction = button.dataset.action;
            const current = state[id].action;
            state[id].action = current === nextAction ? "pending" : nextAction;
            saveState();
            render();
          });
        });

        card.querySelector(".comment").addEventListener("input", (event) => {
          state[id].comment = event.target.value;
          saveState();
        });
      });
    }

    function updateMetrics() {
      const values = Object.values(state);
      document.getElementById("metricTotal").textContent = decisions.length;
      document.getElementById("metricAccepted").textContent = values.filter((item) => item.action === "accept").length;
      document.getElementById("metricDeferred").textContent = values.filter((item) => item.action === "defer").length;
      document.getElementById("metricRejected").textContent = values.filter((item) => item.action === "reject").length;
    }

    function exportMarkdown() {
      const groups = ["accept", "defer", "reject", "pending"];
      const sections = groups.map((group) => {
        const items = decisions.filter((item) => state[item.id].action === group);
        if (!items.length) return "";

        const lines = items.flatMap((item) => {
          const itemState = state[item.id];
          return [
            `- [ ] ${item.id} ${item.title}`,
            `  - Severity: ${item.severity}`,
            `  - Impact: ${item.impact}`,
            `  - Effort: ${item.effort}`,
            `  - Recommendation: ${item.recommendation}`,
            itemState.comment ? `  - Comment: ${itemState.comment.replace(/\n/g, " ")}` : ""
          ].filter(Boolean);
        });

        return [`## ${statusLabel(group)}`, ...lines].join("\n");
      }).filter(Boolean);

      return ["# 決策看板匯出", "", ...sections].join("\n\n");
    }

    function exportJson() {
      return JSON.stringify(decisions.map((item) => ({
        ...item,
        decision: state[item.id].action,
        comment: state[item.id].comment
      })), null, 2);
    }

    function statusLabel(action) {
      return {
        accept: "同意",
        defer: "暫緩",
        reject: "拒絕",
        pending: "未決"
      }[action] || "未決";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.querySelectorAll("[data-severity]").forEach((button) => {
      button.addEventListener("click", () => {
        severityFilter = button.dataset.severity;
        document.querySelectorAll("[data-severity]").forEach((item) => {
          item.setAttribute("aria-pressed", String(item === button));
        });
        render();
      });
    });

    document.querySelectorAll("[data-toggle-column]").forEach((button) => {
      button.addEventListener("click", () => {
        const severity = button.dataset.toggleColumn;
        collapsedColumns[severity] = !collapsedColumns[severity];
        saveCollapsedColumns();
        applyCollapsedColumns();
      });
    });

    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("searchInput").addEventListener("input", (event) => {
      searchTerm = event.target.value.trim().toLowerCase();
      render();
    });

    document.getElementById("exportMarkdownBtn").addEventListener("click", () => {
      document.getElementById("exportOutput").value = exportMarkdown();
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      document.getElementById("exportOutput").value = exportJson();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      document.getElementById("exportOutput").value = "按「匯出 Markdown」或「匯出 JSON」產生輸出。";
      render();
    });

    render();
  </script>
