<!DOCTYPE html>
<!-- 開啟此頁面，點按鈕即可下載擴充功能所需的 3 個圖示 PNG -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>產生圖示</title>
  <style>
    body { font-family: sans-serif; padding: 24px; background: #f5f5f5; }
    button { margin: 8px; padding: 8px 16px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #fff; }
    button:hover { background: #eef; }
    canvas { border: 1px solid #ddd; margin: 8px; border-radius: 4px; }
    h2 { margin-bottom: 12px; color: #333; }
  </style>
</head>
<body>
  <h2>Gemini 文字助手 — 圖示產生器</h2>
  <p style="color:#555;margin-bottom:16px">點擊下方按鈕下載圖示，再放到 <code>icons/</code> 資料夾</p>

  <div id="previews"></div>

  <script>
    const sizes = [16, 48, 128];

    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 背景漸層
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#4285f4');
      grad.addColorStop(1, '#0f9d58');
      ctx.fillStyle = grad;
      const r = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fill();

      // 星號符號 ✦
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(size * 0.55)}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦', size / 2, size / 2 + size * 0.03);

      return canvas;
    }

    const container = document.getElementById('previews');

    sizes.forEach(size => {
      const canvas = drawIcon(size);
      canvas.title = `${size}x${size}`;

      const btn = document.createElement('button');
      btn.textContent = `下載 icon${size}.png`;
      btn.onclick = () => {
        const a = document.createElement('a');
        a.download = `icon${size}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      };

      const label = document.createElement('div');
      label.style.display = 'inline-block';
      label.style.textAlign = 'center';
      label.style.margin = '8px';
      label.appendChild(canvas);
      label.appendChild(document.createElement('br'));
      label.appendChild(btn);
      container.appendChild(label);
    });
  </script>
</body>
</html>
