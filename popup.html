<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>翻翻吧</title>
  <link rel="stylesheet" href="ui-tokens.css">
  <style>
    @font-face {
      font-family: 'jf-openhuninn';
      src: url('fonts/jf-openhuninn-2.1.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 只封鎖水平捲動列。垂直不封死：模型清單有自己的捲動區，
       但萬一其他區塊撐高（字體放大、頁面縮放），仍要讓 popup 捲得到底部 */
    html { overflow-x: hidden; }

    /* 三種字級：14 標題、13 內文、12 輔助（popup 空間小，內文比全頁面小一級） */
    body {
      width: 304px;
      overflow-x: hidden;
      color: var(--text);
      background: var(--page);
      font-family: -apple-system, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    button { font: inherit; color: inherit; }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px 12px 14px;
      background: var(--surface);
      border-bottom: var(--hairline) solid var(--line);
    }

    .header-icon {
      display: block;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: contain;
      animation: logo-glow 2.5s ease-in-out infinite;
    }

    /* drop-shadow 沿圖示輪廓發光：綠 → 黃 緩慢流動 */
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 5px var(--lime-9)) drop-shadow(0 0 10px color-mix(in srgb, var(--lime-9) 50%, transparent)); }
      50%      { filter: drop-shadow(0 0 5px var(--amber-9)) drop-shadow(0 0 12px color-mix(in srgb, var(--amber-9) 50%, transparent)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .header-icon { animation: none; }
    }

    .header h1 {
      flex: 1;
      font-family: 'jf-openhuninn', 'Microsoft JhengHei', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .text-button {
      padding: 4px 6px;
      color: var(--accent-text);
      background: none;
      border: 0;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .text-button:hover { background: var(--accent-soft); }
    .text-button:focus-visible, .model-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

    /* 只有功能會壞掉時才出現 */
    .alert {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 12px 0;
      padding: 6px 6px 6px 10px;
      color: var(--danger-text);
      background: var(--danger-soft);
      border: var(--hairline) solid var(--danger-line);
      border-radius: 8px;
      font-size: 12px;
    }

    .alert[hidden] { display: none; }
    .alert span { flex: 1; }
    .alert .text-button { color: inherit; border-radius: 4px; }
    .alert .text-button:hover { background: var(--red-4); }

    .section { padding: 12px 12px 4px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 24px;
      margin-bottom: 4px;
      padding-left: 2px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    /* 模型清單自己捲，header 保持常駐。max-height 抓 5 項多一點，
       露出下一項的一角當作「還有更多」的提示；模型少於 5 個時不生效 */
    .model-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 300px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--olive-7) transparent;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 10px;
      text-align: left;
      background: transparent;
      border: 1.5px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .model-item:hover { background: var(--lime-2); }

    .model-item.active {
      background: var(--accent-soft);
      border-color: var(--accent-line);
    }

    .model-dot {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--olive-6);
      transition: background 0.15s;
    }

    .model-item.active .model-dot { background: var(--lime-9); }

    .model-info { flex: 1; min-width: 0; }

    .model-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .model-name { font-weight: 600; }

    .model-desc {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .model-badge {
      flex-shrink: 0;
      padding: 0 7px;
      color: var(--text-muted);
      background: var(--olive-3);
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
    }

    .model-item.active .model-badge { color: var(--accent-text); background: var(--surface); }

    .shortcuts { padding: 8px 12px 12px; }

    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 4px 2px;
    }

    .shortcut-key {
      padding: 0 6px;
      color: var(--text);
      background: var(--surface);
      border: var(--hairline) solid var(--line-strong);
      border-radius: 4px;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 20px;
      white-space: nowrap;
    }

    .shortcut-key.unset {
      color: var(--text-muted);
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="header-icon" src="icons/icon128.png" alt="">
    <h1>翻翻吧</h1>
    <button class="text-button" id="openOptions" type="button">設定</button>
  </div>

  <div class="alert" id="keyAlert" role="alert" hidden>
    <span id="keyAlertText"></span>
    <button class="text-button" id="keyAlertAction" type="button">填寫金鑰</button>
  </div>

  <div class="section">
    <div class="section-head" id="modelListLabel">模型</div>
    <div class="model-list" id="modelList" role="radiogroup" aria-labelledby="modelListLabel">
      <!-- 由 popup.js 動態渲染 -->
    </div>
  </div>

  <!-- 實際綁定以 chrome.commands.getAll() 為準，使用者可在瀏覽器改 -->
  <div class="shortcuts">
    <div class="section-head">
      <span id="shortcutLabel">快捷鍵</span>
      <button class="text-button" id="openShortcuts" type="button">變更</button>
    </div>
    <div id="shortcutList"></div>
  </div>

  <script src="models.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
