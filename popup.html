<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>翻翻吧</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      width: 260px;
      background: #fff;
      color: #1a1a1a;
      font-size: 13px;
    }

    /* ── 標題列 ─────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    /* Logo 容器（光暈動畫在此）*/
    .logo-wrap {
      position: relative;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 9px;
      overflow: visible;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: contain;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* drop-shadow 沿圖示輪廓發光：綠 → 黃 緩慢流動，視覺最清晰 */
    @keyframes logo-glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(163, 209, 121, 1)) drop-shadow(0 0 10px rgba(163, 209, 121, 0.5)); }
      50%       { filter: drop-shadow(0 0 5px rgba(249, 212, 35,  1)) drop-shadow(0 0 12px rgba(249, 212, 35,  0.5)); }
    }

    .logo-wrap .header-icon {
      animation: logo-glow 2.5s ease-in-out infinite;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
    }

    .header p {
      font-size: 11px;
      color: #999;
      margin-top: 1px;
    }

    /* ── 模型選擇區 ──────────────────────── */
    .section {
      padding: 12px 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .model-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .model-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }

    .model-item:hover { background: #f5fbee; }

    .model-item.active {
      background: #f0f9e6;
      border-color: #A3D179;
    }

    .model-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ddd;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .model-item.active .model-dot { background: #A3D179; }

    .model-info { flex: 1; }

    .model-name {
      font-size: 12.5px;
      font-weight: 500;
      color: #222;
    }

    .model-desc {
      font-size: 11px;
      color: #999;
      margin-top: 1px;
    }

    .model-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .badge-free  { background: #f0f9e6; color: #5a9a2e; }
    .badge-fast  { background: #fffbea; color: #9a6e00; }
    .badge-lite  { background: #fce8e6; color: #c5221f; }
    .badge-groq  { background: #f3e8ff; color: #7c3aed; }
    .badge-or    { background: #fff4e6; color: #c05a00; }

    /* ── 儲存提示 ────────────────────────── */
    #save-msg {
      font-size: 11.5px;
      color: #5a9a2e;
      text-align: center;
      padding: 0 14px 6px;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    #save-msg.show { opacity: 1; }

    /* ── 底部 ────────────────────────────── */
    .footer {
      border-top: 1px solid #f0f0f0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ── API Key 狀態燈 ──────────────────── */
    .api-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: #888;
    }

    .api-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ccc;
    }

    @keyframes pulse-ok {
      0%, 100% { box-shadow: 0 0 0 0 rgba(163, 209, 121, 0.6); }
      60%       { box-shadow: 0 0 0 5px rgba(163, 209, 121, 0); }
    }

    @keyframes pulse-err {
      0%, 100% { box-shadow: 0 0 0 0 rgba(234, 67, 53, 0.5); }
      60%       { box-shadow: 0 0 0 5px rgba(234, 67, 53, 0); }
    }

    .api-dot.ok  { background: #A3D179; animation: pulse-ok  2s ease infinite; }
    .api-dot.err { background: #ea4335; animation: pulse-err 2s ease infinite; }

    .settings-link {
      font-size: 11.5px;
      color: #5a9a2e;
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .settings-link:hover { text-decoration: underline; }

    /* ── RPD 進度條 ──────────────────────── */
    .model-rpd {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
    }

    .rpd-bar-wrap {
      flex: 1;
      height: 4px;
      background: #e8e8e8;
      border-radius: 99px;
      overflow: hidden;
    }

    /* 正常：品牌色漸層（綠 → 黃）*/
    .rpd-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #A3D179, #F9D423);
      transition: width 0.4s ease;
    }

    /* > 70%：橘黃 → 橘紅 */
    .rpd-bar.warn { background: linear-gradient(90deg, #f9ab00, #ef4444); }

    /* > 90%：全紅 */
    .rpd-bar.full { background: linear-gradient(90deg, #ea4335, #c62828); }

    .rpd-text {
      font-size:   10.5px;
      color:       #999;
      white-space: nowrap;
      min-width:   52px;
      text-align:  right;
    }

    .rpd-text.warn { color: #f9ab00; }
    .rpd-text.full { color: #ea4335; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 標題 -->
  <div class="header">
    <div class="logo-wrap">
      <img class="header-icon" src="icons/icon128.png" alt="翻翻吧">
    </div>
    <div>
      <h1>翻翻吧</h1>
      <p>使用 Gemini AI 翻譯、解釋、優化</p>
    </div>
  </div>

  <!-- 模型選擇 -->
  <div class="section">
    <div class="section-label">選擇模型</div>
    <div class="model-list" id="modelList">
      <!-- 由 popup.js 動態渲染 -->
    </div>
  </div>

  <!-- 儲存提示 -->
  <div id="save-msg">✓ 已切換</div>

  <!-- 底部 -->
  <div class="footer">
    <div class="api-status">
      <div class="api-dot" id="apiDot"></div>
      <span id="apiLabel">檢查中...</span>
    </div>
    <button class="settings-link" id="openOptions">完整設定 →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
